name: Release Windows App (Installer & Portable)

on:
  push:
    tags:
      - 'v*' # این دستور باعث می‌شود فقط با فرستادن تگ‌هایی مثل v1.0.0 یا v1.1 کامپایل شروع شود

jobs:
  release:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install Dependencies
      run: npm install

    # اگر از الکترون استفاده می‌کنید، مطمئن شوید که در package.json تنظیمات پرتابل وجود دارد
    # این دستور پروژه را برای ویندوز کامپایل می‌کند
    - name: Build and Package for Windows
      run: npm run build
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }} # برای اینکه بتونه فایل‌ها رو آپلود کنه

    - name: Create GitHub Release and Upload Assets
      uses: softprops/action-gh-release@v2
      with:
        files: |
          dist/*.exe
          dist/*.zip
          release/**/*.exe
          out/**/*.exe
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
