name: Build Windows EXE

on:
  push:
    branches: [ "main" ] # اگر نام برنچ اصلی شما master است، آن را به master تغییر دهید

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install Dependencies
      run: npm install

    # اگر از الکترون استفاده می‌کنید این خط را نگه دارید؛ 
    # اگر اسکریپت بیلد دیگری در package.json دارید، نام آن را جایگزین build کنید
    - name: Build Windows Application
      run: npm run build 

    - name: Upload EXE Artifact
      uses: actions/upload-artifact@v4
      with:
        name: SiteFlow-Windows-EXE
        path: |
          dist/*.exe
          release/**/*.exe
          out/**/*.exe
